version: 2

# Automated dependency updates (ADR-0036). Scope, grouping and cadence rationale:
# docs/superpowers/specs/2026-08-25-dependabot-design.md
updates:
  # ── Python — the package's dev/lint toolchain ────────────────────────────
  - package-ecosystem: "uv"
    directory: "/defendable-science"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    # [project.dependencies] are deliberately wide floors so consumers can
    # co-install; only the dev/lint groups' == pins may move.
    allow:
      - dependency-type: "development"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
    groups:
      # Order matters — a dependency joins the FIRST group it matches.
      # ruff is 0.x and mypy majors move fast, so their *minor* bumps are the
      # breaking ones; they get a PR of their own.
      python-linters:
        applies-to: version-updates
        patterns: ["ruff", "mypy"]
        update-types: ["minor", "patch"]
      python-tooling:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions ──────────────────────────────────────────────────────
  # `default-days` IS supported here; only the semver-*-days sub-options
  # are not (they require a version-based ecosystem).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies"]
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── pre-commit hooks — keeps `rev:` pins in .pre-commit-config.yaml current
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
    groups:
      hooks:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Devcontainer Features (ADR-0044) ────────────────────────────────────
  # Keeps the exact Feature pins in .devcontainer/devcontainer.json current.
  # This only works because Task 4 pins them to exact versions: a floating
  # `:1`/`:2` tag has no minor/patch component, so the group below would match
  # nothing and the entry would track nothing.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    # As with github-actions: `default-days` IS supported here, but the
    # semver-*-days sub-options are not (GitHub's cooldown support table lists
    # Devcontainers as default-days yes / SemVer-bump days no).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
    groups:
      devcontainer-features:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
