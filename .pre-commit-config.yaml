default_stages: [pre-commit, pre-merge-commit]
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        stages: [pre-commit, pre-merge-commit, manual]
    -   id: end-of-file-fixer
        stages: [pre-commit, pre-merge-commit, manual]
    -   id: check-yaml
        stages: [pre-commit, pre-merge-commit, manual]
    -   id: check-added-large-files
        stages: [pre-commit, pre-merge-commit, manual]

-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        stages: [pre-commit, pre-merge-commit, manual]
        args: [--py311-plus]

# codespell and detect-secrets run as `repo: local` hooks, not remote ones, so
# each tool's version is authored only in `defendable-science/pyproject.toml`'s
# `lint` group. A remote `rev:` here would be a second pin on a second
# Dependabot schedule (issue #79, ADR-0036).
-   repo: local
    hooks:
    -   id: codespell
        name: Spell check (codespell)
        stages: [pre-commit, pre-merge-commit, manual]
        entry: "tools/codespell.sh"
        language: system
        exclude: |
            (?x)^(
                defendable-science/uv.lock
            )$

-   repo: local
    hooks:
    -   id: lint
        name: Linter (ruff)
        stages: [pre-commit, pre-merge-commit, manual]
        entry: "tools/lint.sh"
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        verbose: true

-   repo: local
    hooks:
    -   id: typecheck
        name: Type check (mypy)
        stages: [pre-commit, pre-merge-commit, manual]
        entry: "tools/typecheck.sh"
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        verbose: true

-   repo: local
    hooks:
    -   id: shellcheck
        name: Shell lint (shellcheck)
        stages: [pre-commit, pre-merge-commit, manual]
        entry: "tools/shellcheck.sh"
        language: system
        types: [shell]
        pass_filenames: false
        require_serial: true
        verbose: true

-   repo: local
    hooks:
    -   id: plugin-validate
        name: Validate Claude plugin manifests
        stages: [pre-commit, pre-merge-commit, manual]
        entry: "tools/validate-plugin.sh"
        language: system
        files: ^\.claude-plugin/.*\.json$
        pass_filenames: false
        require_serial: true
        verbose: true

-   repo: local
    hooks:
    -   id: detect-secrets
        name: Detect secrets
        stages: [pre-commit, pre-merge-commit, manual]
        entry: "tools/detect-secrets.sh"
        language: system
        exclude: defendable-science/uv.lock
